[platformio]
default_envs = blackpill_f411ce
src_dir = Core/Src
include_dir = Core/Inc

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
; Upload via USB-C DFU bootloader (hold BOOT0, click NRST):
upload_protocol = dfu
; To upload via external ST-Link V2 dongle, uncomment:
; upload_protocol = stlink
monitor_speed = 115200
build_flags = -Wl,-u,_printf_float

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags = -Wl,-u,_printf_float



